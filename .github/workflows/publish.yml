name: Publish SDK
run-name: SDK ${{ inputs.version }} (${{ inputs.publish && 'publish' || 'build only' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in pyproject.toml
        required: true
        default: '2.0.1'
        type: string
      publish:
        description: Publish to PyPI after verification (requires trusted publisher setup)
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: sdk-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python -c "import os,tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == os.environ['RELEASE_VERSION'], 'Version must match pyproject.toml'"
      - run: python -m pip install -e '.[dev]' build twine
      - run: python -m pytest
      - run: python -m mypy --python-version 3.12 workbench
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/workbench-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist
      - name: Publish verified distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
