name: CI
on:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    name: Verify SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - run: python -m mypy --python-version '${{ matrix.python-version }}' workbench
      - run: python -m build
